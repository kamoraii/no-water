<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Audio Cleaner - Suppresseur d'Empreinte IA</title>

    <!-- PWA / iPhone -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Audio Cleaner">
    <link rel="apple-touch-icon" href="icon.JPEG">

    <!-- LameJS pour encodage MP3 -->
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

    <style>
        :root {
            --bg-deep: #1a1a2e;
            --bg-card: #26264a;
            --mauve: #b39ddb;
            --rose: #f8bbd0;
            --bleu-ciel: #90caf9;
            --turquoise: #80deea;
            --texte: #f0eefb;
            --texte-doux: #b8b4d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, #1a1a2e 0%, #2a1f45 50%, #1f2a3e 100%);
            background-attachment: fixed;
            color: var(--texte);
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: auto;
            padding: 12px 0;
        }

        h1 {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--mauve), var(--rose), var(--bleu-ciel), var(--turquoise));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: var(--texte-doux);
            font-size: 0.85rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .card {
            background: rgba(38, 38, 74, 0.85);
            backdrop-filter: blur(10px);
            border: 1.5px solid rgba(179, 157, 219, 0.35);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
            color: #1a1a2e;
            letter-spacing: 0.3px;
        }

        .btn-audio {
            background: linear-gradient(135deg, var(--mauve), var(--rose));
            border-color: var(--rose);
            box-shadow: 0 4px 12px rgba(248, 187, 208, 0.25);
        }

        .btn-audio:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(248, 187, 208, 0.4);
        }

        .btn-photo {
            background: linear-gradient(135deg, var(--bleu-ciel), var(--turquoise));
            border-color: var(--turquoise);
            box-shadow: 0 4px 12px rgba(128, 222, 234, 0.25);
        }

        .btn-photo:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(128, 222, 234, 0.4);
        }

        .btn-process {
            background: linear-gradient(135deg, #ce93d8, #9fa8da);
            border-color: #ce93d8;
            color: #1a1a2e;
            margin-top: 16px;
            margin-bottom: 0;
            box-shadow: 0 4px 12px rgba(206, 147, 216, 0.3);
        }

        .btn-process:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(206, 147, 216, 0.5);
        }

        .btn-reset {
            background: transparent;
            color: var(--rose);
            border: 2px solid rgba(248, 187, 208, 0.5);
            margin-top: 8px;
            margin-bottom: 0;
            font-size: 0.9rem;
            padding: 10px 20px;
        }

        .btn-reset:hover {
            background: rgba(248, 187, 208, 0.1);
            border-color: var(--rose);
        }

        .btn:disabled {
            background: #3a3a5a;
            color: #6b6b8a;
            border-color: #4a4a6a;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .file-info {
            background: rgba(26, 26, 46, 0.6);
            border: 1.5px dashed rgba(179, 157, 219, 0.4);
            border-radius: 10px;
            padding: 12px;
            margin-top: 16px;
            font-size: 0.8rem;
            color: var(--texte-doux);
            text-align: center;
            word-break: break-all;
        }

        .file-info.active {
            border-style: solid;
            border-color: var(--turquoise);
            color: var(--turquoise);
        }

        .format-selector {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .format-selector label {
            font-size: 0.85rem;
            color: var(--texte-doux);
        }

        .format-selector select {
            background: rgba(26, 26, 46, 0.8);
            color: var(--texte);
            border: 1.5px solid rgba(179, 157, 219, 0.5);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            padding: 12px;
            background: rgba(26, 26, 46, 0.6);
            border-radius: 10px;
            color: var(--texte-doux);
            font-size: 0.85rem;
            text-align: center;
            border: 1.5px solid rgba(144, 202, 249, 0.2);
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hidden {
            display: none !important;
        }

        .note {
            margin-top: 16px;
            font-size: 0.75rem;
            color: var(--texte-doux);
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Audio Cleaner</h1>
    <p class="subtitle">Nettoyeur de signal audio<br>Filtre passe-bas 18 kHz + décalage +0.6%</p>

    <div class="card">
        <button class="btn btn-audio" id="pickAudioBtn">📁 Fichiers</button>
        <button class="btn btn-photo" id="pickVideoBtn">🖼️ Photothèque</button>

        <div class="file-info" id="fileInfo">Aucun fichier sélectionné</div>

        <button class="btn btn-reset hidden" id="resetBtn">✖ Retirer le fichier</button>

        <div class="format-selector">
            <label for="formatSelect">Format de sortie :</label>
            <select id="formatSelect">
                <option value="wav">WAV</option>
                <option value="mp3">MP3</option>
            </select>
        </div>

        <button class="btn btn-process" id="processBtn" disabled>✨ Traiter et enregistrer</button>

        <div id="status">Sélectionnez un fichier audio ou vidéo…</div>
    </div>

    <p class="note">Sur iPhone, la feuille de partage vous permettra d’enregistrer dans le dossier de votre choix.</p>

    <!-- Inputs cachés -->
    <input type="file" id="audioInput" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.opus,.wma,.aiff,.aif" class="hidden">
    <input type="file" id="videoInput" accept="audio/*,video/*,.mp3,.wav,.m4a,.aac,.mp4,.mov,.m4v,.webm" class="hidden">
</div>

<script>
    const audioInput = document.getElementById('audioInput');
    const videoInput = document.getElementById('videoInput');
    const pickAudioBtn = document.getElementById('pickAudioBtn');
    const pickVideoBtn = document.getElementById('pickVideoBtn');
    const processBtn = document.getElementById('processBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusDiv = document.getElementById('status');
    const fileInfo = document.getElementById('fileInfo');
    const formatSelect = document.getElementById('formatSelect');

    let audioBuffer = null;
    let currentFileName = '';

    // Ouvre le sélecteur de fichiers (uniquement app Fichiers sur iOS)
    pickAudioBtn.addEventListener('click', () => audioInput.click());

    // Ouvre le sélecteur de la photothèque (photos/vidéos uniquement)
    pickVideoBtn.addEventListener('click', () => videoInput.click());

    // Gestion commune de la sélection d'un fichier
    async function handleFile(file) {
        if (!file) return;

        currentFileName = file.name;
        fileInfo.textContent = `📎 ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} Mo)`;
        fileInfo.classList.add('active');
        statusDiv.textContent = "Chargement du fichier…";
        processBtn.disabled = true;
        resetBtn.classList.remove('hidden');
        audioBuffer = null;

        try {
            const arrayBuffer = await file.arrayBuffer();
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            statusDiv.textContent = "✅ Fichier prêt au traitement !";
            processBtn.disabled = false;
        } catch (error) {
            statusDiv.textContent = "❌ Impossible de lire ce fichier. Format non supporté.";
            console.error(error);
        }
    }

    audioInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    videoInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

    // Reset : retire le fichier sélectionné
    resetBtn.addEventListener('click', () => {
        audioBuffer = null;
        currentFileName = '';
        fileInfo.textContent = "Aucun fichier sélectionné";
        fileInfo.classList.remove('active');
        statusDiv.textContent = "Sélectionnez un fichier audio ou vidéo…";
        processBtn.disabled = true;
        resetBtn.classList.add('hidden');
        audioInput.value = '';
        videoInput.value = '';
    });

    // Traitement audio
    processBtn.addEventListener('click', async () => {
        if (!audioBuffer) return;

        const format = formatSelect.value;
        statusDiv.textContent = "⏳ Traitement en cours (filtrage + pitch)…";
        processBtn.disabled = true;

        try {
            const playbackRate = 1.006;
            const targetSampleRate = audioBuffer.sampleRate;
            const totalSamples = Math.floor(audioBuffer.length / playbackRate);

            const offlineCtx = new OfflineAudioContext(
                audioBuffer.numberOfChannels,
                totalSamples,
                targetSampleRate
            );

            const source = offlineCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.playbackRate.value = playbackRate;

            const filter = offlineCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 18000;

            source.connect(filter);
            filter.connect(offlineCtx.destination);
            source.start(0);

            const renderedBuffer = await offlineCtx.startRendering();

            let blob, extension;
            if (format === 'mp3') {
                statusDiv.textContent = "💾 Génération du fichier MP3…";
                blob = encodeMP3(renderedBuffer);
                extension = 'mp3';
            } else {
                statusDiv.textContent = "💾 Génération du fichier WAV…";
                blob = bufferToWav(renderedBuffer);
                extension = 'wav';
            }

            const baseName = currentFileName.replace(/\.[^.]+$/, '');
            const fileName = `${baseName}_nettoye.${extension}`;
            const file = new File([blob], fileName, { type: blob.type });

            // Tentative via la feuille de partage iOS (permet de choisir le dossier)
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: fileName,
                        text: "Fichier audio nettoyé"
                    });
                    statusDiv.textContent = "✅ Fichier partagé / enregistré.";
                } catch (shareErr) {
                    // L'utilisateur a annulé le partage ou erreur → on retombe sur le téléchargement
                    if (shareErr.name !== 'AbortError') {
                        console.warn('Erreur partage, téléchargement classique', shareErr);
                        triggerDownload(blob, fileName);
                        statusDiv.textContent = "✅ Fichier téléchargé.";
                    } else {
                        statusDiv.textContent = "ℹ️ Partage annulé.";
                    }
                }
            } else {
                // Navigateur sans partage natif → téléchargement direct
                triggerDownload(blob, fileName);
                statusDiv.textContent = "✅ Fichier téléchargé.";
            }
        } catch (error) {
            statusDiv.textContent = "❌ Erreur lors du traitement.";
            console.error(error);
        }

        processBtn.disabled = false;
    });

    // Déclenche un téléchargement classique
    function triggerDownload(blob, fileName) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // Encodage WAV
    function bufferToWav(buffer) {
        let numOfChan = buffer.numberOfChannels,
            length = buffer.length * numOfChan * 2 + 44,
            bufferArr = new ArrayBuffer(length),
            view = new DataView(bufferArr),
            channels = [], i, sample,
            offset = 0,
            pos = 0;

        function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
        function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

        setUint32(0x46464952);
        setUint32(length - 8);
        setUint32(0x45564157);
        setUint32(0x20746d66);
        setUint32(16);
        setUint16(1);
        setUint16(numOfChan);
        setUint32(buffer.sampleRate);
        setUint32(buffer.sampleRate * 2 * numOfChan);
        setUint16(numOfChan * 2);
        setUint16(16);
        setUint32(0x61746164);
        setUint32(length - pos - 4);

        for (i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

        while (pos < length) {
            for (i = 0; i < numOfChan; i++) {
                sample = Math.max(-1, Math.min(1, channels[i][offset]));
                sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                view.setInt16(pos, sample, true);
                pos += 2;
            }
            offset++;
        }
        return new Blob([bufferArr], { type: "audio/wav" });
    }

    // Encodage MP3 via lamejs
    function encodeMP3(buffer) {
        const numChannels = buffer.numberOfChannels;
        const sampleRate = buffer.sampleRate;
        const kbps = 192;
        const mp3encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, kbps);

        // Conversion Float32 -> Int16
        const left = buffer.getChannelData(0);
        const right = numChannels > 1 ? buffer.getChannelData(1) : null;
        const sampleBlockSize = 1152;
        const mp3Data = [];

        const leftInt = floatTo16BitPCM(left);
        const rightInt = right ? floatTo16BitPCM(right) : null;

        for (let i = 0; i < leftInt.length; i += sampleBlockSize) {
            const leftChunk = leftInt.subarray(i, i + sampleBlockSize);
            const rightChunk = rightInt ? rightInt.subarray(i, i + sampleBlockSize) : null;
            let mp3buf;
            if (numChannels > 1) {
                mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
            } else {
                mp3buf = mp3encoder.encodeBuffer(leftChunk);
            }
            if (mp3buf.length > 0) mp3Data.push(new Int8Array(mp3buf));
        }
        const end = mp3encoder.flush();
        if (end.length > 0) mp3Data.push(new Int8Array(end));

        return new Blob(mp3Data, { type: 'audio/mp3' });
    }

    function floatTo16BitPCM(input) {
        const output = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
            let s = Math.max(-1, Math.min(1, input[i]));
            output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        return output;
    }
</script>

<!-- Enregistrement du service worker -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker enregistré :', reg.scope))
                .catch(err => console.error('Erreur Service Worker :', err));
        });
    }
</script>

</body>
</html>
